<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yoga-instrumenten</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg1: #0b1412; --bg2: #18332d; --text: #eef3ea; --muted: #a3b8ac;
    --accent: #e2b66b; --panel: rgba(225, 255, 240, .06); --line: rgba(225, 255, 240, .15);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 35%, var(--bg2), var(--bg1) 70%);
    color: var(--text); font-family: "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; overflow: hidden; user-select: none;
  }
  header { position: relative; text-align: center; padding: 22px 16px 0; }
  #lang {
    position: absolute; right: 16px; top: 14px; z-index: 4;
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #lang option, #lang optgroup { background: var(--bg2); color: var(--text); }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  header h1 { margin: 0; font-weight: 300; letter-spacing: .3em; font-size: 15px; text-transform: uppercase; color: var(--muted); }
  #stage { position: relative; flex: 1; min-height: 260px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; touch-action: manipulation; }
  .nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font-size: 30px; line-height: 1; cursor: pointer;
    display: grid; place-items: center; transition: background .2s, transform .15s;
  }
  .nav:hover { background: rgba(225, 255, 240, .14); }
  .nav:active { transform: translateY(-50%) scale(.92); }
  #prev { left: max(16px, 4vw); } #next { right: max(16px, 4vw); }
  #info { text-align: center; padding: 0 16px; }
  #name { font-size: 30px; font-weight: 300; margin: 0; }
  #meta { color: var(--accent); font-size: 14px; letter-spacing: .08em; margin-top: 4px; }
  #desc { color: var(--muted); font-size: 14px; max-width: 560px; margin: 8px auto 0; min-height: 2.6em; }
  #dots { display: flex; justify-content: center; gap: 8px; margin: 14px 0 4px; }
  #dots button { width: 9px; height: 9px; padding: 0; border-radius: 50%; border: 0; background: var(--line); cursor: pointer; }
  #dots button.on { background: var(--accent); transform: scale(1.3); }
  #controls {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 22px;
    padding: 14px 16px 10px;
  }
  .btn {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 9px 18px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .btn:hover { background: rgba(225, 255, 240, .14); }
  .btn.on { background: var(--accent); color: #23180c; border-color: var(--accent); }
  label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  input[type=range] { width: 110px; accent-color: var(--accent); }
  footer { display: flex; justify-content: space-between; gap: 12px; padding: 6px 16px 12px; font-size: 12px; color: var(--muted); opacity: .8; }
  kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-family: inherit; }
  #start {
    position: absolute; inset: 0; z-index: 3; display: grid; place-items: center;
    background: rgba(6, 10, 9, .55); backdrop-filter: blur(3px); font-size: 17px; color: var(--text); cursor: pointer;
  }
  #start span { border: 1px solid var(--line); background: var(--panel); padding: 14px 26px; border-radius: 999px; }
  @media (max-width: 600px) {
    .nav { width: 46px; height: 46px; font-size: 24px; }
    #name { font-size: 24px; }
    footer .keys { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1 data-t="app"></h1>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="nl">Nederlands</option>
    <optgroup label="More languages">
      <option value="de">Deutsch</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
    </optgroup>
  </select>
</header>

<div id="stage">
  <canvas id="cv"></canvas>
  <button class="nav" id="prev">‹</button>
  <button class="nav" id="next">›</button>
  <div id="start"><span data-t="start"></span></div>
</div>

<div id="info">
  <h2 id="name"></h2>
  <div id="meta"></div>
  <div id="desc"></div>
  <div id="dots"></div>
</div>

<div id="controls">
  <button class="btn" id="play"><span data-t="play"></span> <kbd data-t="space"></kbd></button>
  <button class="btn" id="flow"><span data-t="flow"></span> <kbd>W</kbd></button>
  <button class="btn" id="hush"><span data-t="hush"></span> <kbd>S</kbd></button>
  <label><span data-t="volume"></span> <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8"></label>
  <label><span data-t="reverb"></span> <input type="range" id="verb" min="0" max="1" step="0.01" value="0.45"></label>
</div>

<footer>
  <span class="keys" data-t="keys"></span>
  <span><a href="https://urbantechmonk.gumroad.com/coffee" target="_blank" rel="noopener" data-t="donate"></a> · <span data-t="app"></span> 1.0</span>

    meta: ['Asia Oriental · baño de gong y savasana', 'Tíbet · apertura y cierre', 'Pirineos · relajación', 'India · mantra y canto', 'India · bordón para meditar',
      'Sonido del mar · savasana', 'Andes · enraizamiento', 'África · ligero y juguetón', 'Todo el mundo · pulso constante'],
    desc: [
      'Una ola de sonido que florece lentamente. Golpea el centro para profundidad, el borde para brillo.',

      'Ocho varillas afinadas en un tubo de bambú. Deja que el viento las toque, o toca para notas sueltas.',
      'Fuelle y lengüetas dan un tono base continuo y cálido sobre el que cantar.',

// ---------- Voorkeuren ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('yogainstr.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('yogainstr.' + k, JSON.stringify(v)); } catch {} },
};

// ---------- Audio ----------
let ctx, bus, master, wet, noiseBuf, rainBuf, tanWave;
const voices = [];          // klinkende klanken, oudste eerst
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function initAudio() {
  if (ctx) return;
  ctx = new AudioContext();
  master = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 4;
  master.connect(comp).connect(ctx.destination);
  bus = ctx.createGain();
  const dry = ctx.createGain(); dry.gain.value = .8;
  bus.connect(dry).connect(master);
  const conv = ctx.createConvolver(); conv.buffer = impulse(4.5);
  wet = ctx.createGain();
  bus.connect(conv).connect(wet).connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
  applyMix();
}

// Synthetische zaalgalm: stereo ruis die exponentieel uitsterft
function impulse(sec) {
  const len = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
  }
  return buf;
}

function applyMix() {
  if (!ctx) return;
  master.gain.setTargetAtTime(+vol.value * .9, ctx.currentTime, .05);
  wet.gain.setTargetAtTime(+verb.value * 1.1, ctx.currentTime, .05);
}

// Eén klank = eigen uitgang, zodat Stilte hem los kan uitfaden
function mkVoice(dur) {
  const now = ctx.currentTime;
  for (let k = voices.length - 1; k >= 0; k--) if (voices[k].end < now) voices.splice(k, 1);
  const out = ctx.createGain(); out.connect(bus);
  const v = { out, nodes: [], end: now + dur };
  voices.push(v);
  while (voices.length > 14) fadeVoice(voices.shift(), .3);
  return v;
}

function fadeVoice(v, tc) {
  const t = ctx.currentTime;
  v.out.gain.cancelScheduledValues(t);
  v.out.gain.setTargetAtTime(0, t, tc);
  v.nodes.forEach(o => { try { o.stop(t + tc * 6); } catch {} });
}

// Sinus (of andere golfvorm) met snelle aanzet en exponentieel uitsterven
function tone(v, f, t, peak, attack, tc, dest) {
  if (f > ctx.sampleRate / 2.2) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + attack);
  g.gain.setTargetAtTime(0, t + attack, tc);
  o.connect(g).connect(dest || v.out);
  o.start(t); o.stop(t + attack + tc * 8); v.nodes.push(o);
}

// Gefilterde ruis; de aanroeper bepaalt het volumeverloop via g.gain
function noise(v, t, dur, type, freq, q, dest) {
  const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  n.buffer = noiseBuf; n.loop = true;
  f.type = type; f.frequency.value = freq; f.Q.value = q; g.gain.value = 0;
  n.connect(f).connect(g).connect(dest || v.out);
  n.start(t, Math.random() * 1.5); n.stop(t + dur + .05); v.nodes.push(n);
  return { f, g };
}
function burst(v, t, dur, peak, type, freq, q) {
  const { g } = noise(v, t, dur, type, freq, q);
  g.gain.setValueAtTime(peak, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
}
function swell(param, t, peak, rise, end) {
  param.setValueAtTime(.0001, t);
  param.exponentialRampToValueAtTime(peak, t + rise);
  param.exponentialRampToValueAtTime(.0001, t + end);
}

// Regenbuffer: honderden korte tikjes die naar het einde toe uitdunnen
function makeRain() {
  const sr = ctx.sampleRate, len = sr * 7, buf = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let n = 0; n < 520; n++) {
      const pos = Math.floor(len * .95 * (1 - Math.sqrt(Math.random())));
      const f = rnd(1500, 7500), amp = rnd(.05, .4), tc = sr * rnd(.0015, .005), w = 2 * Math.PI * f / sr;
      for (let i = 0; i < tc * 6 && pos + i < len; i++) d[pos + i] += Math.sin(w * i) * Math.exp(-i / tc) * amp;
    }
  }
  return buf;
}

// Tanpurasnaar: boventoonrijke golf met een glijdend filter voor de zoemende "jivari"-klank
function pluck(v, f, t, force) {
  if (!tanWave) {
    const n = 40, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) im[k] = 1 / Math.pow(k, .75);
    tanWave = ctx.createPeriodicWave(re, im);
  }
  const o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), lp = ctx.createBiquadFilter();
  const g = ctx.createGain(), gb = ctx.createGain();
  o.setPeriodicWave(tanWave); o.frequency.value = f;
  bp.type = 'bandpass'; bp.Q.value = 2.5;
  bp.frequency.setValueAtTime(f * 12, t);
  bp.frequency.exponentialRampToValueAtTime(f * 4, t + 1.4);
  bp.frequency.exponentialRampToValueAtTime(f * 7, t + 5);
  lp.type = 'lowpass'; lp.frequency.value = f * 3;
  gb.gain.value = 1.6;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.17 * force, t + .03); g.gain.setTargetAtTime(0, t + .03, 1.5);
  o.connect(lp).connect(g); o.connect(bp).connect(gb).connect(g); g.connect(v.out);
  o.start(t); o.stop(t + 9); v.nodes.push(o);
}

// ---------- Instrumenten ----------
// play(x, y, force): x en y lopen van -1..1 over het instrument; x === null = standaardaanslag (spatie)
// flow(n): de n-de stap van "laten doorspelen" → [x, y, force, seconden tot de volgende stap]
// draw(e, t): tekent in een vlak van -100..100; e = hoe hard het instrument nu klinkt
const GONG = [1, 1.51, 2.03, 2.48, 2.97, 3.61, 4.27, 5.12, 6.03, 7.21, 8.63, 10.4];
const KOSHI = [440, 523.25, 659.25, 880, 987.77, 1046.5, 1318.51, 1975.53];
const TANPURA = [98, 130.81, 130.81, 65.41];                     // Pa, Sa, Sa, lage Sa
const KALIMBA = [261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25, 783.99];
const TINES = [7, 5, 3, 1, 0, 2, 4, 6, 8];                       // toon per tong, van links naar rechts
let kalPos = 4, lastTine = 0;

const INSTR = [
  { id: 'gong', ring: 14,
    play(x, y, force) {
      const edge = x === null ? .3 : clamp(Math.hypot(x, y) / .68, 0, 1);
      const v = mkVoice(24), t = ctx.currentTime, f0 = 62;
      GONG.forEach((r, k) => {
        const bloom = k ? .05 + k * .09 * (1 + edge) : .01;          // hoge boventonen zwellen later aan
        const amp = force * .26 / (1 + k * .55) * (k ? .5 + edge * .9 : 1);

// ---------- Tekenhulpjes ----------
const cv = document.getElementById('cv'), g2 = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, layout = null;

function stops(g, cols) { cols.forEach((c, i) => g.addColorStop(i / (cols.length - 1), c)); return g; }
const G = (cols, x0, y0, x1, y1) => stops(g2.createLinearGradient(x0, y0, x1, y1), cols);
const RG = (cols, x, y, r0, r1) => stops(g2.createRadialGradient(x, y, r0, x, y, r1), cols);
function paint(fill, stroke, lw) {
  if (fill) { g2.fillStyle = fill; g2.fill(); }
  if (stroke) { g2.strokeStyle = stroke; g2.lineWidth = lw; g2.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw) { g2.beginPath(); g2.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); paint(fill, stroke, lw); }
function rr(x, y, w, h, r, fill) { g2.beginPath(); g2.roundRect(x, y, w, h, r); paint(fill); }
function path(pts, stroke, lw) { g2.beginPath(); pts.forEach(([x, y], k) => k ? g2.lineTo(x, y) : g2.moveTo(x, y)); paint(null, stroke, lw); }
// Uitdijende klankringen
function rings(x, y, r0, r1, e, t, rgb) {
  if (e < .01) return;
  for (let k = 0; k < 4; k++) {
    const p = (t * .45 + k / 4) % 1;
    ell(x, y, r0 + (r1 - r0) * p, r0 + (r1 - r0) * p, null, `rgba(${rgb},${(1 - p) * Math.min(1, e) * .5})`, 1.4);
  }
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}

// ---------- Navigatie en spelen ----------
const N = INSTR.length;
const mod = (k) => ((k % N) + N) % N;
let target = store.get('instr', 0);         // onbegrensde index, zodat de carrousel rond kan draaien
let pos = target;
const energy = new Array(N).fill(0);
let flow = null;                            // instrument dat nu vanzelf doorspeelt

function hit(i, x = null, y = 0, force = 1) {
  initAudio();
  INSTR[i].play(x, y, force);
  energy[i] = Math.min(1.25, energy[i] + force * .9);
}

function startFlow(i) {
  stopFlow();
  flow = { i, n: 0 };
  flowBtn.classList.add('on');
  flowTick();
}
function flowTick() {
  if (!flow) return;
  const [x, y, force, wait] = INSTR[flow.i].flow(flow.n++);
  hit(flow.i, x, y, force);
  flow.timer = setTimeout(flowTick, wait * 1000);
}
function stopFlow() {
  if (!flow) return;
  clearTimeout(flow.timer);
  flow = null;
  flowBtn.classList.remove('on');
}

function hush() {
  stopFlow();
  if (!ctx) return;
  while (voices.length) fadeVoice(voices.shift(), .35);
  for (let k = 0; k < N; k++) energy[k] = Math.min(energy[k], .2);
}

function go(step) {
  stopFlow();
  target += step;
  showInfo();
}
function jump(i) {
  const d = mod(i - target);
  go(d > N / 2 ? d - N : d);
}
function current() { return mod(target); }

function showInfo() {
  const i = current(), t = LANGS[lang];
  nameEl.textContent = t.name[i];
  metaEl.textContent = t.meta[i];
  descEl.textContent = t.desc[i];
  [...dotsEl.children].forEach((d, k) => d.classList.toggle('on', k === i));
  store.set('instr', i);
}

// Eerste keer: taal van de browser als we die hebben, anders Engels
let lang = store.get('lang', null);
if (!LANGS[lang]) lang = (navigator.languages || [navigator.language]).map(l => (l || '').slice(0, 2)).find(l => LANGS[l]) || 'en';

function applyLang() {
  const t = LANGS[lang];
  document.documentElement.lang = lang;
  document.title = t.app;
  document.querySelectorAll('[data-t]').forEach(el => {
    if (el.dataset.t === 'keys') el.innerHTML = t.keys; else el.textContent = t[el.dataset.t];
  });
  document.getElementById('prev').title = t.prev;
  document.getElementById('next').title = t.next;
  document.querySelector('#lang optgroup').label = t.more;
  [...dotsEl.children].forEach((d, k) => { d.title = `${k + 1}. ${t.name[k]}`; });
  langEl.value = lang;
  showInfo();
}

// ---------- Tekenlus ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now;
  const time = now / 1000;
  pos += (target - pos) * Math.min(1, dt * 7);
  if (Math.abs(target - pos) < .001) pos = target;
  for (let k = 0; k < N; k++) energy[k] *= Math.exp(-dt / (INSTR[k].ring / 4));

  g2.setTransform(DPR, 0, 0, DPR, 0, 0);
  g2.clearRect(0, 0, W, H);
  const base = Math.min(W * .2, H * .42), spacing = Math.max(base * 3, W * .38), cy = H * .5;
  const order = [];
  for (let k = Math.round(pos) - 2; k <= Math.round(pos) + 2; k++) order.push(k);
  order.sort((a, b) => Math.abs(b - pos) - Math.abs(a - pos)); // dichtstbijzijnde als laatste
  layout = null;
  for (const k of order) {
    const d = k - pos, ad = Math.abs(d);
    if (ad > 2.2) continue;
    const i = mod(k), e = energy[i];
    const R = base * (1 - Math.min(ad, 1.5) * .38), cx = W / 2 + d * spacing;
    g2.save();
    g2.translate(cx, cy); g2.scale(R / 100, R / 100);
    g2.globalAlpha = Math.max(0, 1 - ad * .62);
    g2.lineCap = 'round'; g2.lineJoin = 'round';
    if (e > .01) { g2.fillStyle = RG([`rgba(255,215,150,${.2 * Math.min(1, e)})`, 'rgba(255,215,150,0)'], 0, 0, 20, 190); g2.fillRect(-200, -200, 400, 400); }
    ell(0, INSTR[i].floor || 106, 72, 7, 'rgba(0,0,0,.35)');
    INSTR[i].draw(e, time);
    g2.restore();
    if (ad < .5) layout = { cx, cy, R };
  }
  requestAnimationFrame(frame);
}

// ---------- Bediening ----------
const nameEl = document.getElementById('name'), metaEl = document.getElementById('meta');
const descEl = document.getElementById('desc'), dotsEl = document.getElementById('dots');
const vol = document.getElementById('vol'), verb = document.getElementById('verb');
const flowBtn = document.getElementById('flow'), startEl = document.getElementById('start');
const langEl = document.getElementById('lang');

INSTR.forEach((b, k) => {
  const d = document.createElement('button');
  d.onclick = () => jump(k);
  dotsEl.appendChild(d);
});
langEl.onchange = () => { lang = langEl.value; store.set('lang', lang); applyLang(); langEl.blur(); };
vol.value = store.get('vol', .8); verb.value = store.get('verb', .45);
vol.oninput = () => { applyMix(); store.set('vol', +vol.value); };
verb.oninput = () => { applyMix(); store.set('verb', +verb.value); };

function unlock() {
  initAudio();
  if (ctx.state === 'suspended') ctx.resume();
  startEl.remove();
}
function toggleFlow() { unlock(); flow ? stopFlow() : startFlow(current()); }
startEl.onclick = unlock;

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('play').onclick = () => { unlock(); hit(current()); };
flowBtn.onclick = toggleFlow;
document.getElementById('hush').onclick = hush;

// Klik of tik op het instrument: de plek bepaalt de klank
cv.addEventListener('pointerdown', (ev) => {
  unlock();
  if (!layout) return;
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left - layout.cx) / layout.R, y = (ev.clientY - r.top - layout.cy) / layout.R;
  if (Math.abs(x) > 1.1 || Math.abs(y) > 1.1) return;
  hit(current(), x, y);
});

document.addEventListener('keydown', (ev) => {
  if ((ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT') && ev.key.startsWith('Arrow')) return;
  const k = ev.key;
  if (k === 'ArrowLeft' || k === '<' || k === ',') go(-1);
  else if (k === 'ArrowRight' || k === '>' || k === '.') go(1);
  else if (k === ' ' || k === 'Enter') { unlock(); if (!ev.repeat) hit(current()); }
  else if (k === 'w' || k === 'W') { if (!ev.repeat) toggleFlow(); }
  else if (k === 's' || k === 'S') hush();
  else if (/^[1-9]$/.test(k) && +k <= N) jump(+k - 1);
  else return;
  ev.preventDefault();
});

window.addEventListener('resize', resize);
resize();
applyLang();
requestAnimationFrame(frame);
</script>
